# Configuración del motor de reglas de ArchUnit.
#
# Por defecto (failOnEmptyShould=true) una regla que no encuentra ninguna clase hace fallar
# el build. Eso es lo correcto en un proyecto lleno: una regla que no comprueba nada es peor
# que no tenerla, porque da una falsa sensación de protección.
#
# En US-001 todavía no existen los paquetes application ni adapters, así que con el valor
# por defecto el build no podría pasar. Se permite la regla vacía y se compensa de dos formas:
#
#   1. Cada módulo, al crearse, activa automáticamente su regla. El día que aparezca
#      orders.application, la regla de aplicación empieza a comprobar de verdad.
#   2. La prueba lasReglasNoEstanVaciasPorAcierto verifica que el importador funciona y
#      que la regla de dominio, que sí tiene materia, está realmente protegiendo.
#
# Referencia: docs/development/spring-conventions.md §1
archRule.failOnEmptyShould=false
