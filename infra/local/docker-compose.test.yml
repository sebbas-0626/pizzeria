# Perfil de integración: como docker-compose.yml, pero con datos desechables.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up
#
# Diferencias con el entorno de desarrollo, y por qué:
#
#   - Base de datos SIN volumen. Cada ejecución parte de cero, así que un esquema
#     migrado a medias o datos de la ejecución anterior no pueden falsear un test.
#
#   - Perfil `test` de Spring en lugar de `local`: el perfil local enciende Swagger y
#     el detalle del health, que aquí sobran.
#
#   - Puerto 8081 en el host para no chocar con el entorno de desarrollo, que sigue
#     levantado. No se puede probar el catálogo contra un entorno contaminado por otro.
#
# A diferencia del entorno de desarrollo, aquí SÍ se publica el puerto de PostgreSQL:
# lo necesita un proceso que corre fuera de Compose (por ejemplo, un cliente SQL o una
# herramienta de inspección). En desarrollo no se publica por criterio de US-002.
#
# El puerto del host (5435) lo elige quien lo usa: ver el comentario en db.ports.

services:

  db:
    volumes: !reset []
    ports:
      # Puerto del host ELEGIDO A MANO, no por defecto.
      #
      # 5432 queda descartado porque lo tiene el PostgreSQL instalado en Windows, y conectar
      # DBeaver al servidor equivocado no se parece en nada a un fallo de conexión: parece que
      # todo funciona. Por eso el puerto se fija en un valor que se ha comprobado libre:
      #
      #     Get-NetTCPConnection -LocalPort 5435 -State Listen
      #
      # Sin salida significa libre. Ojo con el detalle de este comando: con un contenedor de
      # Docker levantado aparece `wslrelay` y `com.docker.backend` en el puerto publicado, porque
      # así es como Docker Desktop reenvía el tráfico en Windows. **Eso NO significa que haya otro
      # servicio en el puerto**: es el reenvío del propio contenedor. Se comprueba parándolo
      # (`docker stop pizzeria-db-1`) y mirando otra vez: si el puerto queda libre, era nuestro.
      #
      # Si algún día lo ocupa otra cosa de verdad, el síntoma será «la conexión se niega», que es
      # claro. Para cambiarlo, es esta línea y las referencias de docs/development/entorno-local.md.
      - "5435:5432"

  app:
    command:
      - mvn
      - -B
      - -ntp
      - spring-boot:run
      - -Dspring-boot.run.profiles=test
    ports:
      - "8081:8080"
    environment:
      # El perfil test no lee POSTGRES_* (los aporta Testcontainers), pero JPA sí
      # necesita un datasource para arrancar. Se apunta al servicio db de Compose.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s